name: Finalize PKM deployment

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/finalize-pkm.yml]

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployed PKM markers
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://hwahyo-o.github.io/pkm.html"
            "https://hwahyo-o.github.io/link_memo/pkm.html"
          )
          for attempt in $(seq 1 36); do
            for url in "${urls[@]}"; do
              html="$(curl --fail --silent --show-error --location --max-time 20 "$url" || true)"
              if grep -Fq 'id="graphTooltip"' <<<"$html" && grep -Fq '#DE6863' <<<"$html"; then
                echo "Verified deployed PKM markers at $url"
                exit 0
              fi
            done
            echo "Deployment not ready (attempt $attempt/36)"
            sleep 10
          done
          echo "Deployed PKM markers were not observed"
          exit 1
      - name: Delete non-main branches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in drill ci-drill finalize-pkm; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done
